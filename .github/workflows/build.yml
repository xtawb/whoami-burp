name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the wrapper jar is the one binary in the repository: check it is Gradle's own
      - uses: gradle/actions/wrapper-validation@v4

      - name: Build the jar and run the harness
        run: ./gradlew --no-daemon jar harness

      - name: The jar holds our classes and nothing else
        shell: bash
        run: |
          unzip -Z1 build/libs/whoami-burp.jar | grep '\.class$' | grep -v -E '^whoami/burp/' && exit 1
          unzip -Z1 build/libs/whoami-burp.jar | grep -q '^whoami/burp/WhoAmIExtension.class$'

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: whoami-burp
          path: build/libs/whoami-burp.jar
          if-no-files-found: error
